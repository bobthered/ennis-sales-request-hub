<!doctype html>
<html lang="en" data-color="blue" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply before styles render to avoid a flash of the wrong theme.
			(() => {
				const key = 'ennis-theme';
				const root = document.documentElement;
				const system = window.matchMedia('(prefers-color-scheme: dark)');
				const normalize = (value) => (['dark', 'light', 'os'].includes(value) ? value : 'os');
				const read = () => {
					try {
						return normalize(localStorage.getItem(key));
					} catch {
						return 'os';
					}
				};
				let preference = read();
				const apply = () => {
					const mode = preference === 'os' ? (system.matches ? 'dark' : 'light') : preference;
					root.dataset.theme = mode;
					root.dataset.themePreference = preference;
					root.style.colorScheme = mode;
					window.dispatchEvent(new Event('ennis-theme-applied'));
				};
				window.addEventListener('ennis-theme-preference', (event) => {
					preference = normalize(event.detail);
					try {
						localStorage.setItem(key, preference);
					} catch {
						/* Storage is optional. */
					}
					apply();
				});
				system.addEventListener('change', apply);
				window.addEventListener('storage', (event) => {
					if (event.key === key || event.key === null) {
						preference = read();
						apply();
					}
				});
				apply();
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
